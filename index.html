<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prank App</title>
    <style>
        #prank-message {
            display: none;
            text-align: center;
            font-size: 30px;
            color: red;
        }
    </style>
</head>
<body>
    <h1>Welcome to the Prank!</h1>
    <div id="prank-message">Surprise! You've been pranked!</div>

    <!-- Audio element to play sound -->
    <audio id="prank-sound" src="Prank1.mp3"></audio>

    <script>
        // Trigger the prank after 3 seconds and play the sound
        setTimeout(function() {
            // Show the prank message
            document.getElementById('prank-message').style.display = 'block';

            // Play the sound
            document.getElementById('Prank1').play();
        }, 3000); // 3 seconds
    </script>
</body>
</html>
